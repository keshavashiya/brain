name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The grpc adapter pulls in `protobuf-src`, which builds Abseil +
      # protoc from C++ source. That toolchain doesn't link cleanly with
      # MSVC on the GitHub Windows runner (LNK2019 against ucrt symbols
      # like __imp_nan / __imp_modf). Compile-gate everything else on
      # Windows and let Linux/macOS exercise grpc.
      - name: Workspace check (Windows — exclude grpc adapter + binary)
        if: runner.os == 'Windows'
        run: |
          cargo check --workspace --exclude brainos-grpcadapter --exclude brainos
          cargo check -p brainos --no-default-features --features encryption,ganglia
        shell: bash
      - name: Workspace check (Unix)
        if: runner.os != 'Windows'
        run: cargo check --workspace

  check-minimal:
    name: Check (no default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Smoke check that the workspace still compiles without default
      # features. The remaining flags (`grpc`, `encryption`, `ganglia`)
      # are real and shipped together; `--features encryption` exercises
      # the conditional crypto path.
      - run: cargo check -p brainos --no-default-features
      - run: cargo check -p brainos --no-default-features --features encryption

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  crate-names:
    name: Crate Names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/check-crate-names.sh

  boundaries:
    name: Module boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/check-boundaries.sh

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # PR diff check needs the merge-base; fetch full history.
          fetch-depth: 0
      - name: Validate CHANGELOG.md
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: ./scripts/check-changelog.sh

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Pin to the declared MSRV. Bumps here must move workspace
      # rust-version + README + CHANGELOG together.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The terminal bridge spawns PTYs (portable-pty / nix), which doesn't
        # support Windows the same way. Windows runs the compile-only `check`
        # job in the matrix above; `test` covers the two Unix-family hosts
        # where the PTY paths actually exercise.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # PTY-spawning integration tests (terminal bridge) intermittently hit
      # fork ENOMEM on the default heuristic overcommit policy when many
      # heavyweight tests run in parallel. Switching to always-overcommit
      # lets fork() clone page tables without spurious failures. macOS does
      # not have this knob, so guard the step.
      - name: Enable memory overcommit (Linux only)
        if: runner.os == 'Linux'
        run: sudo sysctl -w vm.overcommit_memory=1
      - run: cargo test --workspace

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Audit dependencies
        run: cargo audit

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Run all checks: advisories, bans, licenses, sources.
          command: check all

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Enable memory overcommit for PTY tests
        run: sudo sysctl -w vm.overcommit_memory=1
      - name: Run coverage
        run: |
          cargo tarpaulin --workspace \
            --engine llvm \
            --out xml \
            --skip-clean \
            --ignore-panics \
            --lib \
            --tests \
            --fail-under 50
      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: cobertura.xml
          fail_ci_if_error: false
