name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  check-minimal:
    name: Check (no default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Smoke check that the workspace still compiles without default
      # features. The remaining flags (`grpc`, `encryption`, `ganglia`)
      # are real and shipped together; `--features encryption` exercises
      # the conditional crypto path.
      - run: cargo check -p brainos --no-default-features
      - run: cargo check -p brainos --no-default-features --features encryption

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # PTY-spawning integration tests (terminal bridge) intermittently hit
      # fork ENOMEM on the default heuristic overcommit policy when many
      # heavyweight tests run in parallel. Switching to always-overcommit
      # lets fork() clone page tables without spurious failures.
      - run: sudo sysctl -w vm.overcommit_memory=1
      - run: cargo test --workspace

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Audit dependencies
        run: cargo audit

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Enable memory overcommit for PTY tests
        run: sudo sysctl -w vm.overcommit_memory=1
      - name: Run coverage
        run: |
          cargo tarpaulin --workspace \
            --engine llvm \
            --out xml \
            --skip-clean \
            --ignore-panics \
            --lib \
            --tests \
            --fail-under 50
      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: cobertura.xml
          fail_ci_if_error: false
