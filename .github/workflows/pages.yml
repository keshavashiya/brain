name: Docs

# Builds the mdBook documentation and deploys to GitHub Pages.
# Runs on pushes to main and on PRs (preview-only, no deploy).

on:
  push:
    branches: [main]
    paths: ['docs/**']
  pull_request:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Docs assistant: retrieval engine (WASM) + search index ──────────────
      # Both must be built before `mdbook build` so the generated assets in
      # docs/src/assistant/ get copied into the book output.
      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build retrieval engine (WASM)
        run: wasm-pack build docs/assistant --target web --out-dir ../src/assistant/pkg --release

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: docs/tools/.cache
          key: hf-minilm-${{ hashFiles('docs/tools/index.mjs') }}

      - name: Build search index
        working-directory: docs/tools
        run: |
          npm ci
          node index.mjs

      - name: Install mdBook
        run: cargo install mdbook --locked

      - name: Build book
        run: mdbook build docs
        env:
          MDBOOK_OUTPUT__HTML__SITE_URL: /brain/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
