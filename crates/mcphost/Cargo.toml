[package]
name = "brainos-mcphost"
description = "MCP host — mounts external Model Context Protocol servers (stdio/HTTP/SSE) for Brain OS"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
brain_core   = { workspace = true }
observe      = { workspace = true }
identity     = { workspace = true }
async-trait  = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
tokio        = { workspace = true }
tracing      = { workspace = true }
chrono       = { workspace = true }
sha2         = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# `rmcp` (the Rust SDK for MCP) is added alongside the first transport
# implementation. Kept out of this trait-only crate to avoid pulling a
# large dep tree for types that aren't yet exercised.
