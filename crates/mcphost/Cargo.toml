[package]
name = "brainos-mcphost"
description = "MCP host — mounts external Model Context Protocol servers (stdio/HTTP/SSE) for Brain OS"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
brain_core   = { workspace = true }
observe      = { workspace = true }
identity     = { workspace = true }
async-trait  = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
tokio        = { workspace = true, features = ["process"] }
tracing      = { workspace = true }
chrono       = { workspace = true }
sha2         = { workspace = true }
# Rust SDK for the Model Context Protocol. `client` enables the RoleClient
# bindings; `transport-child-process` brings TokioChildProcess for stdio
# mounts. HTTP transport features are added when the streamable HTTP
# client lands.
rmcp = { version = "1.7", features = ["client", "transport-child-process"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
