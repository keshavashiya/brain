[package]
name = "brainos-mcphost"
description = "MCP host — mounts external Model Context Protocol servers (stdio/HTTP/SSE) for Brain OS"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
brain_core   = { workspace = true }
observe      = { workspace = true }
identity     = { workspace = true }
vault        = { workspace = true }
async-trait  = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
tokio        = { workspace = true, features = ["process"] }
tracing      = { workspace = true }
chrono       = { workspace = true }
sha2         = { workspace = true }
uuid         = { workspace = true }
url          = { workspace = true }
reqwest      = { workspace = true }
http         = "1"
# Rust SDK for the Model Context Protocol. `client` enables the RoleClient
# bindings; `transport-child-process` brings TokioChildProcess for stdio
# mounts; `transport-streamable-http-client-reqwest` brings the reqwest-backed
# HTTP transport; `auth` brings the OAuth 2.1 state machine.
rmcp = { version = "1.7", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "auth",
] }

[dev-dependencies]
tokio      = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock   = { workspace = true }
axum       = { workspace = true }
tokio-util = { version = "0.7" }
# Pull in the server-side rmcp features for round-trip mounts in tests. Cargo
# unifies features across dependency / dev-dependency declarations, so the
# extra features only apply when building the test profile.
rmcp = { version = "1.7", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
] }
