# Fallback context-window rules, matched against the lowercased model name.
# Used by providers whose API doesn't expose `context_length`, and as a
# second-chance fallback after API-based detection fails.
#
# Rules are evaluated top to bottom; the first match wins. A rule matches
# when EVERY group in `contains_all_of` has at least one substring present
# (groups are AND-ed, members within a group are OR-ed), AND none of
# `excludes` is present, AND — when `starts_with_any` is set — the name
# starts with one of those prefixes. Order matters (e.g. gpt-4o must precede
# the generic gpt-4 rule).
#
# Users can override or extend this by dropping a `context_windows.yaml`
# into `<data_dir>/models/`; user rules are consulted before these.
rules:
  # Gemini 1.5/2.0/2.5 — 1M window (flash-lite is the exception).
  - contains_all_of: [[gemini]]
    excludes: [gemini-2.0-flash-lite]
    window: 1000000

  # Claude 3/4 — Opus, Sonnet, Haiku all share 200K.
  - contains_all_of: [[claude]]
    window: 200000

  # GPT-4o / GPT-4.5 / GPT-4-turbo — 128K. Must precede the generic gpt-4 rule.
  - contains_all_of: [[gpt-4o, gpt-4.5, gpt-4-turbo]]
    window: 128000
  # GPT-3.5 — 16K.
  - contains_all_of: [[gpt-3.5]]
    window: 16000
  # GPT-4 (non-4o, non-turbo) — 32K generous fallback.
  - contains_all_of: [[gpt-4]]
    window: 32000
  # o1 / o3 reasoning models — 200K (prefix match).
  - starts_with_any: [o1, o3]
    window: 200000

  # DeepSeek V2/V3/R1 — 128K.
  - contains_all_of: [[deepseek]]
    window: 128000
  # Qwen 2.5 — 128K.
  - contains_all_of: [[qwen]]
    window: 128000

  # Llama 3.x — 128K; older Llama falls back to 8K.
  - contains_all_of: [[llama], ["3"]]
    window: 128000
  - contains_all_of: [[llama]]
    window: 8192

  # Mistral / Mixtral — Large/Nemo/Codestral = 128K; others = 32K.
  - contains_all_of: [[mistral, mixtral], [large, nemo, codestral]]
    window: 128000
  - contains_all_of: [[mistral, mixtral]]
    window: 32000

  # Command R / R+ (Cohere) — 128K.
  - contains_all_of: [[command-r]]
    window: 128000

  # DBRX / MPT — 32K.
  - contains_all_of: [[dbrx, mpt]]
    window: 32000

  # Explicit context indicators in the model id (OpenRouter community models).
  - contains_all_of: [[128k, 131k, 131072]]
    window: 131072
  - contains_all_of: [[200k]]
    window: 200000
  - contains_all_of: [[1m, 1000k]]
    window: 1000000

  # Large open-source models (parameter count in the name) — 128K.
  - contains_all_of: [[70b, 120b, 180b, 240b]]
    window: 131072

  # "oss" (open-source) models on OpenRouter — 128K.
  - contains_all_of: [["/oss", "oss-", "-oss"]]
    window: 131072
