# Brain - Default Configuration
# Override with ~/.brain/config.yaml or environment variables

brain:
  version: "0.2.0"
  data_dir: "~/.brain"

storage:
  ruvector_path: "~/.brain/ruvector/"
  sqlite_path: "~/.brain/db/brain.db"
  hnsw:
    ef_construction: 200
    m: 16
    ef_search: 50

llm:
  provider: "ollama"
  model: "qwen2.5-coder:7b"
  base_url: "http://localhost:11434"
  api_key: ""                 # Required for openai provider; also settable via BRAIN_LLM__API_KEY env var
  temperature: 0.7
  max_tokens: 4096
  # Optional multi-provider pool. When set, Brain probes each entry's
  # /models endpoint at startup and picks the first reachable one whose
  # `preferred_models` are live. Falls back to the single-provider fields
  # above when empty. `kind` accepts `ollama`, `openai_compat`, or any
  # preset name (openai, openrouter, groq, deepseek, together, gemini-compat).
  providers: []
  # Example:
  #   providers:
  #     - name: "local"
  #       kind: "ollama"
  #       base_url: "http://localhost:11434"
  #       model: "qwen2.5-coder:7b"
  #       preferred_models: ["qwen2.5-coder:7b", "llama3.1:8b"]
  #     - name: "groq-free"
  #       kind: "groq"
  #       api_key: "gsk_..."
  #       model: "llama-3.3-70b-versatile"
  #       preferred_models: ["llama-3.3-70b-versatile", "llama-3.1-8b-instant"]
  #     - name: "openrouter-free"
  #       kind: "openrouter"
  #       api_key: "sk-or-..."
  #       model: "meta-llama/llama-3.1-8b-instruct:free"
  #       preferred_models: ["meta-llama/llama-3.1-8b-instruct:free"]

embedding:
  model: "nomic-embed-text"    # must be pulled: `ollama pull nomic-embed-text`
  dimensions: 768              # must match the model output size (nomic-embed-text → 768)

memory:
  episodic:
    max_entries: 100000
    retention_days: 365
  semantic:
    similarity_threshold: 0.65
    max_results: 20
  search:
    hybrid_weight: 0.7         # Weight for vector search (1-weight for BM25)
    rrf_k: 60                  # RRF fusion parameter
    pre_fusion_limit: 50       # Candidates fetched from each source before RRF fusion
    importance_weight: 0.3     # Weight for importance in reranking (0.0–1.0)
    recency_weight: 0.2        # Weight for recency in reranking (0.0–1.0)
    decay_rate: 0.01           # Forgetting curve decay rate (higher = faster forgetting)
  consolidation:
    enabled: true
    interval_hours: 24
    forgetting_threshold: 0.05 # Memories below this are candidates for pruning

encryption:
  enabled: false               # Run `brain init --encrypt` to generate a salt and enable

security:
  exec_allowlist:
    - ls
    - grep
    - find
    - git
    - cargo
    - rustc
  exec_timeout_seconds: 30

actions:
  web_search:
    enabled: true
    provider: "searxng"       # searxng | tavily | custom
    endpoint: "http://localhost:8888"  # SearXNG default; override for your instance
    api_key: ""               # Required for tavily provider
    timeout_ms: 3000
    default_top_k: 5
  scheduling:
    enabled: false
    mode: "persist_only"      # Persist intents only; no internal cron runner
  messaging:
    enabled: false
    timeout_ms: 3000
    channels: {}
    # ─────────────────────────────────────────────────────────────────────
    # Channel configuration — each key becomes a webhook destination for
    # both proactive notifications (proactivity.delivery.webhook_channels)
    # and explicit SendMessage intents ("send via <channel> to <recipient>").
    #
    # Template placeholders in body:
    #   {{channel}}    — the channel key (e.g. "discord")
    #   {{recipient}}  — target user/role (empty for proactive notifications)
    #   {{content}}    — the message text (auto JSON-escaped)
    #   {{namespace}}  — memory namespace (default: "personal")
    #   {{timestamp}}  — ISO 8601 UTC timestamp
    #
    # Shorthand (URL only — uses default JSON body):
    #   alerts: "https://example.com/hook"
    #
    # Full config (custom body template + headers):
    # ─────────────────────────────────────────────────────────────────────
    #
    # ── Discord (via Webhook URL) ────────────────────────────────────────
    # Create a webhook in Discord: Channel Settings → Integrations → Webhooks
    #   discord:
    #     url: "https://discord.com/api/webhooks/<WEBHOOK_ID>/<WEBHOOK_TOKEN>"
    #     body: '{"content": "{{content}}"}'
    #     headers: {}
    #
    # ── Telegram (via Bot API) ──────────────────────────────────────────
    # Create a bot via @BotFather, get CHAT_ID via your bot's updates API:
    #   telegram:
    #     url: "https://api.telegram.org/bot<BOT_TOKEN>/sendMessage"
    #     body: '{"chat_id": "<CHAT_ID>", "text": "{{content}}", "parse_mode": "Markdown"}'
    #     headers:
    #       Authorization: "Bearer <BOT_TOKEN>"
    #
    # ── Slack (via Incoming Webhook) ────────────────────────────────────
    #   slack:
    #     url: "https://hooks.slack.com/services/T00/B00/xxx"
    #     body: '{"text": "{{content}}"}'
    #     headers: {}
    #
    # ── Generic Webhook (any HTTP endpoint) ─────────────────────────────
    #   webhook:
    #     url: "https://hooks.example.com/services/brain"
    #     body: '{"channel": "{{channel}}", "message": "{{content}}", "ts": "{{timestamp}}"}'
    #     headers:
    #       X-API-Key: "your-api-key-here"
    #       Content-Type: "application/json"
  resilience:
    max_retries: 2            # retries on transient errors (5xx, timeout, connection refused)
    retry_base_ms: 500        # base delay; doubles each retry (500 → 1000 → 2000)
    circuit_breaker_threshold: 5    # consecutive failures before circuit opens
    circuit_breaker_cooldown_secs: 60  # seconds to wait before retrying after circuit opens

proactivity:
  enabled: true                # Enabled by default (max 2/day, wide quiet hours)
  max_per_day: 2
  min_interval_minutes: 60
  quiet_hours:
    start: "20:00"
    end: "10:00"
    timezone: "UTC"              # IANA timezone name (e.g. "America/New_York")
  delivery:
    outbox: true               # Always write to outbox; drain on next interaction
    broadcast: true            # Push to live WS/SSE sessions
    webhook_channels: []       # Channel keys from actions.messaging.channels to receive proactive notifications
                               # Example: ["discord", "telegram"]
    max_outbox_age_days: 7     # Prune stale undelivered outbox items during consolidation
  open_loop:
    enabled: true              # Detect unresolved commitments (requires proactivity.enabled: true)
    scan_window_hours: 72      # How far back to scan for commitments
    resolution_window_hours: 24  # Hours before an unresolved commitment triggers a reminder
    check_interval_minutes: 120  # How often to check for open loops

adapters:
  http:
    enabled: true
    host: "127.0.0.1"
    port: 19789
    cors: true
  ws:
    enabled: true
    port: 19790
  mcp:
    enabled: true
    stdio: true
    http: true
    port: 19791
  grpc:
    enabled: true
    port: 19792

channel:
  # Bidirectional relay gateways (long-lived WebSocket, not one-way webhooks).
  # Each relay registers with the channel router and participates in
  # cross-channel approval correlation — a user can approve on any relay.
  relays: []
  # Example:
  #   relays:
  #     - id: "telegram"
  #       label: "Telegram"
  #       url: "ws://127.0.0.1:7000/brain"
  #       namespace: "personal"
  #       api_key: ""
  #       initial_backoff_ms: 1000
  #       max_backoff_ms: 60000

access:
  api_keys: []
  # A random API key is generated on `brain init` and printed to stdout.
  # Add additional keys here if needed:
  # api_keys:
  #   - key: "brk_<random-hex>"
  #     name: "My Key"
  #     permissions: [read, write]
