[package]
name = "brainos-storage"
description = "SQLite and HNSW vector storage layer for Brain OS"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["encryption"]
encryption = ["dep:aes-gcm", "dep:argon2"]

[dependencies]
async-trait = { workspace = true }
resilience = { workspace = true }
rusqlite = { workspace = true }
aes-gcm = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
base64 = "0.22"
ruvector-core = { version = "2.0.5", default-features = false, features = ["storage", "hnsw"] }

[dev-dependencies]
tempfile = "3"
