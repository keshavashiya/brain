syntax = "proto3";

package brain.agent;

// AgentService allows AI agents to connect to Brain and exchange
// signals over a persistent gRPC connection.
service AgentService {
  // Establish an agent session and receive a session ID.
  rpc Connect(ConnectRequest) returns (ConnectResponse);

  // Send a signal and receive a single response.
  rpc SendSignal(SignalRequest) returns (SignalResponse);

  // Subscribe to a stream of updates for a session.
  rpc ReceiveSignals(ReceiveRequest) returns (stream SignalUpdate);

  // Subscribe to the v1.0.0 BrainEvent observability bus
  // (see docs/v1.0.0.md §8). Mirrors the HTTP SSE and WebSocket surfaces;
  // events are emitted as JSON strings using the same enum schema.
  rpc BrainEvents(BrainEventsRequest) returns (stream BrainEventMessage);
}

// ── Connect ───────────────────────────────────────────────────────────────────

message ConnectRequest {
  string agent_id   = 1;
  string agent_type = 2;
}

message ConnectResponse {
  string session_id = 1;
  bool   accepted   = 2;
  string message    = 3;
}

// ── SendSignal ────────────────────────────────────────────────────────────────

message SignalRequest {
  string source  = 1;
  string channel = 2;
  string sender  = 3;
  string content = 4;
  map<string, string> metadata = 5;
  // Optional namespace (default: "personal").
  string namespace = 6;
  // Originating agent identity — opaque id chosen by the caller.
  string agent = 7;
  // Optional session ID for conversation continuity.
  string session_id = 8;
}

message SignalResponse {
  string signal_id     = 1;
  string status        = 2;
  string response      = 3;
  uint32 facts_used    = 4;
  uint32 episodes_used = 5;
  // Session ID for conversation continuity.
  string session_id    = 6;
}

// ── ReceiveSignals ────────────────────────────────────────────────────────────

message ReceiveRequest {
  string session_id = 1;
}

message SignalUpdate {
  string event_type = 1;
  string content    = 2;
  string timestamp  = 3;
}

// ── BrainEvents ──────────────────────────────────────────────────────────────

message BrainEventsRequest {
  // BrainEvent variant discriminant (e.g. "signal_received"). Empty = all.
  string kind      = 1;
  // Filter to a specific tool_id (only meaningful for tool-bound events).
  string tool_id   = 2;
  // Principal filter — accepted for forward compatibility; Phase 0 events do
  // not yet carry a principal. Empty = no filter.
  string principal = 3;
  // RFC3339 timestamp; only events with ts >= since are forwarded.
  string since     = 4;
}

message BrainEventMessage {
  // BrainEvent serialised as JSON. Clients deserialise into the same enum
  // schema used by the SSE / WS / brain-tail surfaces.
  string event_json = 1;
}
