[package]
name = "brainos"
description = "Brain OS — local-first AI memory engine. Stop giving your AI amnesia."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "brain"
path = "src/main.rs"

[features]
default = ["grpc", "bridge", "encryption", "ganglia"]
grpc = ["dep:grpcadapter"]
bridge = ["dep:bridge"]
encryption = ["storage/encryption", "signal/encryption"]
ganglia = ["dep:ganglia"]

[dependencies]
brain_core = { workspace = true }
storage = { workspace = true }
rusqlite = { workspace = true }
hippocampus = { workspace = true }
cortex = { workspace = true }
thalamus = { workspace = true }
signal = { workspace = true }
ganglia = { workspace = true, optional = true }
httpadapter = { workspace = true }
wsadapter = { workspace = true }
grpcadapter = { workspace = true, optional = true }
mcp = { workspace = true }
bridge = { workspace = true, optional = true }
backends = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = "0.3"
clap = { workspace = true }
rustyline = { workspace = true }
crossterm = { workspace = true }
rpassword = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
audit = { workspace = true }
confirm = { workspace = true }
budget = { workspace = true }
sandbox = { workspace = true }

[dev-dependencies]
tokio-tungstenite = { workspace = true }
futures-util = "0.3"
tonic = { version = "0.14", features = ["transport"] }
tempfile = "3"
