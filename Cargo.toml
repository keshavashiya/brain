[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/storage",
    "crates/hippocampus",
    "crates/cortex",
    "crates/thalamus",
    "crates/amygdala",
    "crates/signal",
    "crates/adapters/http",
    "crates/adapters/ws",
    "crates/adapters/grpc",
    "crates/adapters/mcp",
    "crates/cerebellum",
    "crates/ganglia",
    "crates/bridge",
    "crates/backends",
    "crates/cli",
    "crates/audit",
    "crates/confirm",
    "crates/budget",
    "crates/sandbox",
    "crates/vault",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Keshav Ashiya"]
license = "MIT"
repository = "https://github.com/keshavashiya/brain"
homepage = "https://github.com/keshavashiya/brain"
keywords = ["ai", "memory", "local", "mcp", "llm"]
categories = ["cli", "database"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Configuration
figment = { version = "0.10", features = ["yaml", "env"] }

# Async traits
async-trait = "0.1"

# Async streams
futures = "0.3"

# HTTP client
reqwest = { version = "0.13", features = ["json", "stream", "blocking", "query"] }

# Database
rusqlite = { version = "0.39", features = ["bundled"] }

# Encryption
aes-gcm = "0.10"
argon2 = "0.5"

# Hashing (audit log)
sha2 = "0.10"

# Constant-time comparison
subtle = "2"

# CLI
clap = { version = "4", features = ["derive"] }
rustyline = "18"
rpassword = "7"

# Terminal UI
crossterm = "0.28"

# LRU cache
lru = "0.12"

# HTTP server
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors"] }
async-stream = "0.3"
futures-core = "0.3"

# WebSocket
tokio-tungstenite = "0.26"

# Internal crates
brain_core = { package = "brainos-core", path = "crates/core", version = "0.2.0" }
storage = { package = "brainos-storage", path = "crates/storage", version = "0.2.0", default-features = false }
hippocampus = { package = "brainos-hippocampus", path = "crates/hippocampus", version = "0.2.0" }
cortex = { package = "brainos-cortex", path = "crates/cortex", version = "0.2.0" }
thalamus = { package = "brainos-thalamus", path = "crates/thalamus", version = "0.2.0" }
amygdala = { package = "brainos-amygdala", path = "crates/amygdala", version = "0.2.0" }
signal = { package = "brainos-signal", path = "crates/signal", version = "0.2.0", default-features = false }
httpadapter = { package = "brainos-httpadapter", path = "crates/adapters/http", version = "0.2.0" }
wsadapter = { package = "brainos-wsadapter", path = "crates/adapters/ws", version = "0.2.0" }
grpcadapter = { package = "brainos-grpcadapter", path = "crates/adapters/grpc", version = "0.2.0" }
mcp = { package = "brainos-mcp", path = "crates/adapters/mcp", version = "0.2.0" }
cerebellum = { package = "brainos-cerebellum", path = "crates/cerebellum", version = "0.2.0" }
ganglia = { package = "brainos-ganglia", path = "crates/ganglia", version = "0.2.0" }
bridge = { package = "brainos-bridge", path = "crates/bridge", version = "0.2.0" }
backends = { package = "brainos-backends", path = "crates/backends", version = "0.2.0" }
audit = { package = "brainos-audit", path = "crates/audit", version = "0.2.0" }
confirm = { package = "brainos-confirm", path = "crates/confirm", version = "0.2.0" }
budget = { package = "brainos-budget", path = "crates/budget", version = "0.2.0" }
sandbox = { package = "brainos-sandbox", path = "crates/sandbox", version = "0.2.0" }
vault = { package = "brainos-vault", path = "crates/vault", version = "0.2.0" }

# Benchmarks
criterion = { version = "0.5", features = ["html_reports"] }

# Testing
mockito = "1"
